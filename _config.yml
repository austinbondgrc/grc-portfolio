title: Austin Bond — GRC Portfolio
# The fallback meta description, used by any page that does not define its own.
# It has to read as a description of the site rather than as a subtitle: 154
# characters, so it survives a search result without being truncated.
description: "An ISO 27001:2022 ISMS build for a fictional German B2B SaaS company: scope, risk register, Statement of Applicability, NIS2 and DSGVO records, audit."

# Canonical origin. Needed for absolute URLs in the sitemap and in the 404 page's
# relative_url links; without it Jekyll emits root-relative paths.
url: https://austinbondgrc.github.io
baseurl: /grc-portfolio

plugins:
  - jekyll-sitemap

# No theme. The layout, masthead and stylesheet are local (_layouts/_includes and
# assets/css/site.css), so the site is not tied to a theme's markup or class names.

# Every page gets the branded shell without repeating `layout: default` in six
# front matters. A page that needs to opt out sets its own `layout:`.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Tooling lives outside version control; excluded here so a local build never
# publishes it. README.md and AGENTS.md carry no front matter, so Jekyll treats
# them as static files and copies them verbatim: the repository README and the
# agent rules were being served as raw text on the public site.
exclude:
  - tools/
  - README.md
  - AGENTS.md
